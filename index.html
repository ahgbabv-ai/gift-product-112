<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sun-Mun Decors - Home Decor & Showpieces</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f9f9f9;
            color: #333;
        }
        header {
            background-color: #2c3e50;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        header h1 {
            font-size: 24px;
            color: #f39c12;
        }
        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-size: 16px;
        }
        nav a:hover {
            color: #f39c12;
        }
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .section-title {
            font-size: 28px;
            margin-bottom: 20px;
            text-align: center;
            color: #2c3e50;
        }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
        }
        .product-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            transition: transform 0.3s ease;
        }
        .product-card:hover {
            transform: translateY(-5px);
        }
        .product-card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }
        .product-info {
            padding: 20px;
        }
        .product-info h3 {
            font-size: 18px;
            margin-bottom: 10px;
            color: #2c3e50;
        }
        .price {
            font-size: 20px;
            color: #e74c3c;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 10px;
            background-color: #f39c12;
            color: white;
            text-align: center;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
        }
        .btn:hover {
            background-color: #e67e22;
        }
        footer {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 50px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Sun-Mun Decors</h1>
        <nav>
            <a href="#home">Home</a>
            <a href="#products">Products</a>
            <a href="#support">Support</a>
        </nav>
    </header>

    <div class="container" id="products">
        <h2 class="section-title">Our Exclusive Collection</h2>
        <div class="product-grid" id="product-container">
            <!-- JavaScript se products yahan load honge -->
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Sun-Mun Decors. All Rights Reserved.</p>
    </footer>

    <script>
        // Aapke saare 6 products ke exact verified links ke sath array
        const products = [
            {
                id: 1,
                name: "Premium Home Decor Item",
                price: 1299,
                img: "https://i.ibb.co/PkqBKQR/915f5-G4-BQ2-L-AC-UF894-1000-QL80.jpg"
            },
            {
                id: 2,
                name: "Elegant Showpiece",
                price: 1599,
                img: "https://i.ibb.co/SHvv0rq/71-Zag-KL7eo-L.jpg"
            },
            {
                id: 3,
                name: "Resin Radha Krishna Murti with Peacock",
                price: 2499,
                img: "https://i.ibb.co/HTZQY6hH/Resin-Radha-Krishna-Murti-with-Peacock-1.png"
            },
            {
                id: 4,
                name: "Designer Artifact",
                price: 1899,
                img: "https://i.ibb.co/Q3DJxvcT/A.jpg"
            },
            {
                id: 5,
                name: "Modern Living Room Decor",
                price: 999,
                img: "https://i.ibb.co/BHkttKMS/image-137b876c-1.jpg"
            },
            {
                id: 6,
                name: "Luxury Craft Ornament",
                price: 2999,
                img: "https://i.ibb.co/5WrKWJW9/b8sd-Fmmn-9afed7d22c914579a4bb6e1a8aeb5ccb.webp"
            }
        ];

        const productContainer = document.getElementById("product-container");

        // Products ko screen par render karne ka loop
        products.forEach(product => {
            const productCard = `
                <div class="product-card">
                    <img src="${product.img}" alt="${product.name}">
                    <div class="product-info">
                        <h3>${product.name}</h3>
                        <div class="price">₹${product.price}</div>
                        <a href="#" class="btn" onclick="alert('Product added to cart!')">Buy Now</a>
                    </div>
                </div>
            `;
            productContainer.innerHTML += productCard;
        });
    </script>

</body>
</html>
